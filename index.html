<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lớp học Cô Điệp AI - giao bài, chấm bài, điểm danh</title>
<meta name="description" content="Giao bài, học sinh nộp bài bằng mã và PIN, AI gợi ý chấm, cô duyệt rồi trả bài. Có điểm danh, xếp hạng, phiếu bài tập mỗi ngày, PowerPoint theo kế hoạch bài dạy, nhận xét giữa kì cuối kì.">
<link rel="icon" href="anh-nho.jpg">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1f3a;--royal:#0b5cab;--blue:#1d7bd8;--gold:#ffc94a;--ok:#16a34a;--bad:#dc2626;--cam:#f77f00;--phu:#4a6378;--vien:#d3e6f8;--nen:#f2f8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Be Vietnam Pro",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#e3f3ff,#f6fbff 40%,#fff8e8);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:linear-gradient(135deg,#06285a,#0b5cab 60%,#1d7bd8);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(6,40,90,.25)}
.top .in{max-width:1100px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font:800 20px "Baloo 2",sans-serif;color:#fff;text-decoration:none}.logo b{color:var(--gold)}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav a,.nav button{background:transparent;border:0;color:#d8ebff;padding:8px 12px;border-radius:12px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none}
.nav .on{background:#ffffff26;color:#fff}.nav a:hover,.nav button:hover{background:#ffffff1a}
main{max-width:1100px;margin:0 auto;padding:18px 14px 70px}
h1{font:800 clamp(24px,4vw,32px) "Baloo 2",sans-serif;margin:6px 0 4px;color:var(--royal)}
h2{font:800 20px "Baloo 2",sans-serif;color:var(--royal);margin:0 0 10px}
.phu{color:var(--phu);font-size:14px}
.the{background:#fff;border-radius:20px;box-shadow:0 8px 26px rgba(11,92,171,.12);padding:18px;margin-bottom:16px}
.luoi{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.lop{background:#fff;border:2px solid var(--vien);border-radius:18px;padding:16px;cursor:pointer;transition:.15s;text-align:left;width:100%}
.lop:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 10px 24px rgba(11,92,171,.15)}
.lop b{font:800 19px "Baloo 2",sans-serif;color:var(--royal);display:block}
.chip{display:inline-block;background:var(--nen);border:1px solid var(--vien);border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;margin:6px 6px 0 0;color:var(--phu)}
.chip.cam{background:#fff1e0;border-color:#ffd9a8;color:#b45309}.chip.xanh{background:#e6f9ee;border-color:#b6ebcb;color:#15803d}.chip.do{background:#fee2e2;border-color:#fecaca;color:#b91c1c}
.btn{border:0;border-radius:13px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--royal);color:#fff;font-size:14.5px}
.btn:hover{filter:brightness(1.08)}.btn.cam{background:linear-gradient(135deg,#ff9a3d,#f77f00)}.btn.xanh{background:var(--ok)}
.btn.nhat{background:#eaf3fd;color:var(--royal);border:1px solid var(--vien)}.btn.do{background:#fee2e2;color:#b91c1c}.btn.nho{padding:6px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 14px}
.tab{border:2px solid var(--vien);background:#fff;border-radius:99px;padding:8px 15px;font-weight:700;font-size:14px;cursor:pointer;color:var(--phu)}
.tab.on{background:var(--royal);border-color:var(--royal);color:#fff}
.tab.cam.on{background:var(--cam);border-color:var(--cam)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=datetime-local],input[type=url],select,textarea{width:100%;padding:10px 12px;border:2px solid var(--vien);border-radius:12px;background:#fff;font-size:15px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid #9fd4ff;border-color:var(--blue)}
label{display:block;font-weight:700;font-size:13.5px;margin:12px 0 4px;color:#27415c}
.hang{display:flex;gap:10px;flex-wrap:wrap}.hang>*{flex:1;min-width:140px}
.bang{width:100%;border-collapse:collapse;font-size:14.5px}
.bang th{background:#eaf3fd;color:var(--royal);text-align:left;padding:9px 10px;font-size:13px}
.bang td{padding:9px 10px;border-top:1px solid #e6eef8;vertical-align:middle}
.bang tr:hover td{background:#fafcff}
.cuon{overflow-x:auto}
.nen{position:fixed;inset:0;background:#06285aa6;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.hop{background:#fff;border-radius:20px;max-width:640px;width:100%;padding:20px;box-shadow:0 20px 60px #0008}
.hop.rong{max-width:980px}
.hop h3{font:800 21px "Baloo 2",sans-serif;margin:0 0 6px;color:var(--royal)}
.chan{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.thongbao{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0b1f3a;color:#fff;padding:11px 20px;border-radius:99px;z-index:90;font-weight:600;box-shadow:0 8px 24px #0006;max-width:90vw}
.thongbao.loi{background:var(--bad)}
.banner{background:#fff6dd;border:1px solid #ffe08a;border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.banner.do{background:#fee2e2;border-color:#fecaca}
.trong{text-align:center;color:var(--phu);padding:28px 10px}
.dang{display:inline-block;width:18px;height:18px;border:3px solid #cfe1f5;border-top-color:var(--royal);border-radius:50%;animation:q .7s linear infinite;vertical-align:-3px}
@keyframes q{to{transform:rotate(360deg)}}
.so{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.so div{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 6px 18px rgba(11,92,171,.1)}
.so b{display:block;font:800 26px "Baloo 2",sans-serif;color:var(--royal);line-height:1.1}.so span{font-size:12.5px;color:var(--phu)}
.cam-xx{background:#f7fbff;border:1px solid var(--vien);border-radius:14px;padding:12px;font-size:14.5px;white-space:pre-wrap}
.ai{background:#fff6ec;border:1px solid #ffd9a8;border-radius:14px;padding:12px;font-size:14px}
.anhbai{max-width:100%;border-radius:12px;border:1px solid var(--vien);margin:6px 0;display:block}
.cot2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.cot2{grid-template-columns:1fr}}
.dd button{border:2px solid var(--vien);background:#fff;border-radius:10px;padding:5px 12px;font-weight:700;cursor:pointer;margin-right:4px}
.dd button.C.on{background:var(--ok);border-color:var(--ok);color:#fff}.dd button.V.on{background:var(--bad);border-color:var(--bad);color:#fff}.dd button.P.on{background:var(--cam);border-color:var(--cam);color:#fff}
iframe.cc{width:100%;height:calc(100vh - 190px);min-height:600px;border:2px solid var(--vien);border-radius:16px;background:#fff}
.hs-hero{max-width:520px;margin:30px auto}
.bt-hs{background:#fff;border:2px solid var(--vien);border-radius:18px;padding:15px;margin-bottom:12px}
.bt-hs h3{margin:4px 0;font:800 18px "Baloo 2",sans-serif}
.diemto{font:800 34px "Baloo 2",sans-serif;color:var(--ok)}
pre.hd{white-space:pre-wrap;background:#0b1f3a;color:#d9ecff;border-radius:14px;padding:14px;font-size:13.5px;overflow:auto}
.dong-da{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:20px;font-weight:700}.dong-da .phep{min-width:120px}.dong-da input{width:110px;font-size:20px;font-weight:700;text-align:center;padding:7px}
.chonda{display:flex;align-items:center;gap:10px;margin:6px 0;padding:10px 12px;border:2px solid var(--vien);border-radius:12px;background:#fff;font-size:18px;cursor:pointer}.chonda input{width:22px;height:22px;flex:none}
.vuong{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--vien)}
</style>
</head>
<body>
<div id="goc"></div>
<script>
// LÕI XỬ LÝ DÙNG CHUNG: chạy trên Google Apps Script (thật) và trong trình duyệt (chế độ thử).
// S = kho dữ liệu {all(bang), put(bang,rec), del(bang,id)}; E = môi trường {now, cfg, setCfg, saveImg, loadImg, delImg, ai}
var CORE = (function () {
  function rid(p) { return p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
  function pin4() { return String(Math.floor(1000 + Math.random() * 9000)); }
  function loi(m) { return { ok: false, loi: m }; }
  function bo(s) { return String(s == null ? '' : s).trim(); }
  function khongDau(s) { return bo(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase(); }
  function ma2(n) { return n < 10 ? '0' + n : String(n); }

  // ----- phân tích đề: dòng kết thúc bằng "=" là câu điền; các dòng A. B. C. D. liên tiếp là câu chọn; dấu * đầu lựa chọn = đáp án đúng -----
  var NL = String.fromCharCode(10);
  function dongDe(de) { return String(de == null ? '' : de).split(NL).map(function (s) { return s.replace(/\s+$/, ''); }); }
  function laLuaChon(s) { return /^\s*\*?\s*[A-Da-d][\.\)]\s*\S/.test(s); }
  function nhomChon(d) {
    var g = [], i = 0;
    while (i < d.length) { if (laLuaChon(d[i])) { var j = i; while (j + 1 < d.length && laLuaChon(d[j + 1])) j++; if (j > i) g.push({ tu: i, den: j }); i = j + 1; } else i++; }
    return g;
  }
  function cauHoi(de) {
    var d = dongDe(de), g = nhomChon(d), q = [], i = 0;
    while (i < d.length) {
      var nh = null; for (var k = 0; k < g.length; k++) if (g[k].tu === i) nh = g[k];
      if (nh) { q.push({ k: 'chon', tu: nh.tu, den: nh.den }); i = nh.den + 1; continue; }
      if (/=$/.test(d[i])) q.push({ k: 'dien', i: i });
      i++;
    }
    return q;
  }
  function chuanDe(de) {
    var d = dongDe(de), qs = cauHoi(de), key = [], sach = d.slice();
    qs.forEach(function (c, ix) {
      key[ix] = null;
      if (c.k === 'chon') for (var x = c.tu; x <= c.den; x++) {
        var m = /^(\s*)\*\s*([A-Da-d][\.\)].*)$/.exec(d[x]);
        if (m) { if (key[ix] == null) key[ix] = m[2].trim().charAt(0).toUpperCase(); sach[x] = m[1] + m[2]; }
      }
    });
    return { de: sach.join(NL), key: key };
  }
  function chuanDa(s) { return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, '').replace(/,/g, '.').replace(/^([a-d])[\.\)].*$/, '$1'); }

  function find(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }
  function dsHS(S, lop) { return S.all('hs').filter(function (h) { return h.lop === lop; }).sort(function (a, b) { return a.stt - b.stt; }); }

  function handle(act, p, S, E) {
    p = p || {};
    if (act === 'trangthai') return { ok: true, coMK: !!E.cfg('mk'), coAI: !!E.cfg('gemini') };
    if (act === 'khoi_tao') {
      if (E.cfg('mk')) return loi('Đã có mật khẩu rồi.');
      if (bo(p.mk).length < 4) return loi('Mật khẩu cần ít nhất 4 ký tự.');
      E.setCfg('mk', bo(p.mk)); return { ok: true };
    }
    if (act === 'gv_dangnhap') {
      if (!E.cfg('mk')) return loi('chua_co_mk');
      return bo(p.mk) === E.cfg('mk') ? { ok: true } : loi('Sai mật khẩu.');
    }
    if (act.indexOf('gv_') === 0) {
      if (!E.cfg('mk') || bo(p.mk) !== E.cfg('mk')) return loi('Chưa đăng nhập hoặc sai mật khẩu.');
      return gv(act, p, S, E);
    }
    if (act === 'lop_thongtin') {
      var l = find(S.all('lop'), p.lop);
      if (!l) return loi('Không tìm thấy lớp. Em nhờ cô gửi lại link nhé.');
      return { ok: true, ten: l.ten, mota: l.mota || '' };
    }
    if (act.indexOf('hs_') === 0) return hs(act, p, S, E);
    return loi('Không hiểu yêu cầu: ' + act);
  }

  // ===== cô giáo =====
  function gv(act, p, S, E) {
    var i, l, h, bt, nop;
    switch (act) {
      case 'gv_lop_ds': {
        var ls = S.all('lop'), H = S.all('hs'), B = S.all('bt'), N = S.all('nop');
        return { ok: true, ds: ls.map(function (x) {
          return { id: x.id, ten: x.ten, mota: x.mota, xephang: x.xephang !== false,
            soHS: H.filter(function (q) { return q.lop === x.id; }).length,
            soBai: B.filter(function (q) { return q.lop === x.id; }).length,
            choCham: N.filter(function (q) { return q.lop === x.id && q.tt === 'cho'; }).length };
        }) };
      }
      case 'gv_lop_luu': {
        if (!bo(p.ten)) return loi('Cô nhập tên lớp giúp em.');
        l = p.id ? find(S.all('lop'), p.id) : null;
        l = l || { id: rid('L'), tao: E.now() };
        l.ten = bo(p.ten); l.mota = bo(p.mota); l.xephang = p.xephang !== false;
        S.put('lop', l); return { ok: true, id: l.id };
      }
      case 'gv_lop_xoa': {
        ['hs', 'bt', 'nop', 'dd'].forEach(function (t) { S.all(t).forEach(function (x) { if (x.lop === p.id) S.del(t, x.id); }); });
        S.del('lop', p.id); return { ok: true };
      }
      case 'gv_hs_ds': {
        var N2 = S.all('nop').filter(function (n) { return n.lop === p.lop; });
        return { ok: true, ds: dsHS(S, p.lop).map(function (q) {
          return { id: q.id, stt: q.stt, ma: q.ma, ten: q.ten, sdt: q.sdt || '', pin: q.pin,
            soNop: N2.filter(function (n) { return n.hs === q.id; }).length };
        }) };
      }
      case 'gv_hs_them': {
        var stt = dsHS(S, p.lop).reduce(function (m, q) { return Math.max(m, q.stt); }, 0);
        var moi = 0;
        String(p.ds || '').split(/\r?\n/).map(bo).filter(Boolean).forEach(function (d) {
          var c = d.split(/[|\t;]/).map(bo);
          c[0] = c[0].replace(/^\d+\s*[\.\)\-]\s*(?=\D)/, '');
          if (!c[0] || /^(stt|họ tên|ho ten|họ và tên)$/i.test(c[0])) return;
          stt++;
          S.put('hs', { id: rid('H'), lop: p.lop, stt: stt, ma: ma2(stt), ten: c[0], sdt: c[1] || '', pin: pin4(), fails: 0, khoa: 0 });
          moi++;
        });
        return { ok: true, them: moi };
      }
      case 'gv_hs_sua': {
        h = find(S.all('hs'), p.id); if (!h) return loi('Không thấy học sinh.');
        if (bo(p.ten)) h.ten = bo(p.ten);
        if (p.sdt != null) h.sdt = bo(p.sdt);
        S.put('hs', h); return { ok: true };
      }
      case 'gv_hs_pin': {
        h = find(S.all('hs'), p.id); if (!h) return loi('Không thấy học sinh.');
        h.pin = pin4(); h.fails = 0; h.khoa = 0; S.put('hs', h); return { ok: true, pin: h.pin };
      }
      case 'gv_hs_xoa': {
        S.all('nop').forEach(function (n) { if (n.hs === p.id) S.del('nop', n.id); });
        S.del('hs', p.id); return { ok: true };
      }
      case 'gv_bt_ds': {
        var Bs = S.all('bt').filter(function (b) { return b.lop === p.lop; }).sort(function (a, b) { return a.tao - b.tao; });
        var tong = dsHS(S, p.lop).length;
        var Nn = S.all('nop').filter(function (n) { return n.lop === p.lop; });
        return { ok: true, tongHS: tong, ds: Bs.map(function (b) {
          var ns = Nn.filter(function (n) { return n.bt === b.id; });
          var o = JSON.parse(JSON.stringify(b));
          o.soNop = ns.length; o.choCham = ns.filter(function (n) { return n.tt === 'cho'; }).length;
          o.daTra = ns.filter(function (n) { return n.tt !== 'cho'; }).length; return o;
        }) };
      }
      case 'gv_bt_luu': {
        var tt = p.loai === 'tt', url = bo(p.url);
        if (!bo(p.ten) || (!tt && !bo(p.de))) return loi('Cô nhập tên bài và đề bài giúp em.');
        if (tt && !/^(https?:\/\/[^\s"'<>]+|[A-Za-z0-9_\-\/\.]+\.html(\?[^\s"'<>]*)?)$/.test(url)) return loi('Cô chọn trò chơi trong kho hoặc dán link bắt đầu bằng https://');
        if (tt && url.indexOf('..') >= 0) return loi('Đường dẫn không hợp lệ.');
        bt = p.id ? find(S.all('bt'), p.id) : null;
        bt = bt || { id: rid('B'), lop: p.lop, tao: E.now() };
        var ch = chuanDe(tt ? '' : bo(p.de)), ro = bo(p.dapan).split(NL).map(bo).filter(function (x) { return x !== ''; }), key = ch.key.slice();
        for (var ki = 0; ki < ro.length; ki++) key[ki] = ro[ki];
        bt.deGoc = tt ? '' : bo(p.de); bt.dapan = tt ? '' : bo(p.dapan); bt.key = tt ? [] : key;
        bt.buoi = bo(p.buoi); bt.ten = bo(p.ten); bt.de = tt ? (bo(p.de) || 'Em bấm Chơi để làm bài.') : ch.de; bt.tieuchi = bo(p.tieuchi);
        bt.loai = tt ? 'tt' : ''; bt.url = tt ? url : ''; bt.tuCham = p.tuCham !== false;
        bt.han = Number(p.han) || 0; bt.thang = Number(p.thang) || 10; bt.muon = !!p.muon;
        bt.cho = { viet: p.cho ? p.cho.viet !== false : true, anh: p.cho ? p.cho.anh !== false : true, link: !!(p.cho && p.cho.link) };
        bt.hien = p.hien !== false;
        S.put('bt', bt); return { ok: true, id: bt.id };
      }
      case 'gv_bt_xoa': {
        S.all('nop').forEach(function (n) { if (n.bt === p.id) S.del('nop', n.id); });
        S.del('bt', p.id); return { ok: true };
      }
      case 'gv_nop_ds': {
        bt = find(S.all('bt'), p.bt); if (!bt) return loi('Không thấy bài tập.');
        var N3 = S.all('nop').filter(function (n) { return n.bt === bt.id; });
        return { ok: true, bt: bt, ds: dsHS(S, bt.lop).map(function (q) {
          var n = null; for (i = 0; i < N3.length; i++) if (N3[i].hs === q.id) n = N3[i];
          return { hs: q.id, ma: q.ma, ten: q.ten, nop: n ? { id: n.id, luc: n.luc, tt: n.tt, diem: n.diem, lan: n.lan, coAI: !!n.ai, muon: !!(bt.han && n.luc > bt.han) } : null };
        }) };
      }
      case 'gv_nop_xem': {
        nop = find(S.all('nop'), p.id); if (!nop) return loi('Không thấy bài nộp.');
        h = find(S.all('hs'), nop.hs); bt = find(S.all('bt'), nop.bt);
        return { ok: true, nop: nop, anh: (nop.imgs || []).map(function (id) { return E.loadImg(id); }),
          hs: h ? { ma: h.ma, ten: h.ten } : {}, bt: bt };
      }
      case 'gv_cham': {
        nop = find(S.all('nop'), p.id); if (!nop) return loi('Không thấy bài nộp.');
        bt = find(S.all('bt'), nop.bt);
        var d = (p.diem === '' || p.diem == null) ? null : Number(p.diem);
        if (d != null && (isNaN(d) || d < 0 || d > bt.thang)) return loi('Điểm phải từ 0 đến ' + bt.thang + '.');
        nop.diem = d; nop.nx = bo(p.nx); nop.tieubieu = !!p.tieubieu;
        if (p.lamlai) nop.tt = 'lamlai'; else if (p.trave) nop.tt = 'tra';
        if (p.trave || p.lamlai) nop.tratruoc = E.now();
        S.put('nop', nop); return { ok: true };
      }
      case 'gv_ai_cham': {
        nop = find(S.all('nop'), p.id); if (!nop) return loi('Không thấy bài nộp.');
        bt = find(S.all('bt'), nop.bt);
        if (!E.cfg('gemini')) return loi('Cô chưa nhập khóa AI (Gemini) ở mục Cài đặt AI.');
        var imgs = (nop.imgs || []).map(function (id) { return E.loadImg(id); }).filter(Boolean);
        var kq;

function tbHS(h, bts) { var s = 0, c = 0; bts.forEach(function (b) { var x = h.diem[b.id]; if (x && x.tt === 'tra' && x.d != null) { s += x.d / b.thang * 10; c++; } }); return c ? Math.round(s / c * 10) / 10 : null; }
async function tabXH() {

  }).join('') + '</table></div>';

function taiDiem() {
  var r = window._dd; taiCSV('Bang-diem.csv', [['Mã', 'Họ tên'].concat(r.bt.map(function (b) { return b.ten + ' (/' + b.thang + ')'; })).concat(['Điểm TB (thang 10)', 'Có mặt', 'Vắng', 'Có phép'])].concat(r.hs.map(function (h) {
    return [h.ma, h.ten].concat(r.bt.map(function (b) { var x = h.diem[b.id]; return x && x.tt === 'tra' && x.d != null ? x.d : ''; })).concat([tbHS(h, r.bt) == null ? '' : tbHS(h, r.bt), h.dd.co, h.dd.vang, h.dd.phep]);
  })));
}
